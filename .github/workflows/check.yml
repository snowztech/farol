name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      # Only used when no prebuilt libghostty exists for the pinned commit.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: make test
